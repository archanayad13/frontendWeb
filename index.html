<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>digital clock</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <div id="nav">
            <button id="clock-btn" class="btns">Clock</button>

            <button id="stopwatch-btn" class="btns">Stopwatch</button>
            <button id="timer-btn" class="btns">Timer</button>
        </div>
        <div id="clock">
            <p id="clock-display" class="display"> 00:00:00 </p>
            <div id="calendar">
                <p id="day">day</p>
                <p id="date">date</p>
            </div>
        </div>
        <div id="stopwatch" class="hidden">
            <div id="stopwatch-display" class="display"> 00:00:00 </div>
            <div id="stopwatch-btns">
                <button class="button" id="start-btn">Start</button>
                <button class="button" id="pause-btn">Pause</button>
                <button class="button" id="reset-btn">Reset</button>
                <button class="button" id="lap-btn">Lap</button>
            </div>
        </div>
        <div id="timer" class="hidden">
            <div id="timer-btn">
                <button id="min">0</button>
                <button id="sec">0</button>
            </div>
            <div id="timer-display" class="display"> 00:00 </div>
            <button class="button" id="start-timer">Start</button>
            <button class="button" id="pause-timer">Pause</button>
            <button class="button" id="reset-timer">Reset</button>

        </div>
    </div>
    <script src="script.js"></script>
</body>


</html>
